name: Update profile stats

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&theme=github_dark
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&hide_title=true&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Refresh activity graphs when upstream is available
        shell: bash
        run: |
          mkdir -p profile

          if curl --fail --silent --show-error --location \
            "https://github-readme-activity-graph.vercel.app/graph?username=${GITHUB_REPOSITORY_OWNER}&theme=github-compact&area=true&radius=12&hide_title=true" \
            --output /tmp/activity-dark.svg; then
            mv /tmp/activity-dark.svg profile/activity-dark.svg
          else
            echo "Dark activity graph refresh failed. Keeping the previous local copy if present."
          fi

          if curl --fail --silent --show-error --location \
            "https://github-readme-activity-graph.vercel.app/graph?username=${GITHUB_REPOSITORY_OWNER}&theme=github&area=true&radius=12&hide_title=true" \
            --output /tmp/activity-light.svg; then
            mv /tmp/activity-light.svg profile/activity-light.svg
          else
            echo "Light activity graph refresh failed. Keeping the previous local copy if present."
          fi

      - name: Commit generated profile assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No profile asset changes."
            exit 0
          fi

          git commit -m "chore: refresh profile stats"
          git push
